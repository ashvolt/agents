[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents"
version = "0.1.0"
description = "Level 0 to pro agent engineering, ending in a production-ready agent"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pillow>=11.0",
    "numpy>=2.0",
    # CV feature extraction for the no-vision-model decider. Headless: no GUI, no Qt.
    # Earns its place with connectedComponentsWithStats - see capstone/tools/features.py.
    "opencv-python-headless>=4.10",
    # Fits the decider (capstone/evals/train_decider.py). Inference does not import it;
    # the model ships as JSON coefficients.
    "scikit-learn>=1.5",
    # Text detection: PaddleOCR's DBNet, run through ONNX Runtime. The model ships inside
    # the wheel, so nothing is downloaded at runtime. Chosen over the component detector
    # on real artwork, where the latter missed most captions (capstone/docs/real-art.md).
    "rapidocr_onnxruntime>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# Building the real-artwork evaluation set (capstone/data/real_art.py): renders the
# openly licensed SVG illustrations at print resolution. Not needed to run the pipeline.
data = [
    "cairosvg>=2.7",
    "pyarrow>=15",  # reading DiffusionDB's metadata (capstone/data/fetch_ai_art.py)
]
# The local web demo (capstone/demo): upload a file, see the verdict. Not needed to run
# the pipeline or the evals.
demo = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["shared*", "levels*", "capstone*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["levels", "capstone"]
markers = [
    "integration: hits the real Anthropic API and costs money (deselect with '-m \"not integration\"')",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Level exercises import what their unfilled stubs will need. They are teaching material
# with deliberate gaps, so an unused import there is the exercise, not a defect. Shipped
# code under capstone/ and shared/ gets no such exemption.
"levels/*/exercise.py" = ["F401"]
